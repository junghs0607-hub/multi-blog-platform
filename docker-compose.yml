# Mosaic 로컬 개발/배포용 Docker Compose
#
#   DB 만 실행 (권장 개발 방식):   docker compose up -d db
#   MinIO(S3 호환 스토리지) 포함:  docker compose --profile s3 up -d
#   앱까지 컨테이너로 실행:         docker compose --profile app up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
      POSTGRES_DB: mosaic
      # 한글 검색(형태 무관 부분 일치) 품질을 위해 UTF-8 로케일로 초기화합니다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 버킷 자동 생성 (S3_BUCKET=mosaic)
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/mosaic;
      exit 0;
      "

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mosaic:mosaic@db:5432/mosaic
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/storage
      JOB_MODE: inline
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  miniodata:
  storage:
